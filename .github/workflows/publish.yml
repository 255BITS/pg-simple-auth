name: Publish to PyPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.registry.outputs.version }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, check and test distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}"
          python -I - <<'PY'
          from pg_simple_auth import AuthConfig, initialize
          from passlib.hash import argon2

          digest = argon2.hash("test password")
          assert argon2.verify("test password", digest)
          PY
      - name: Check the exact version on PyPI
        id: registry
        if: github.repository == '255BITS/pg-simple-auth' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          version="$(python -c 'from importlib.metadata import version; print(version("pg-simple-auth"))')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/pg-simple-auth/$version/json")"
          case "$status" in
            200) echo "pg-simple-auth $version already exists on PyPI" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: steps.registry.outputs.publish == 'true'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish tested distributions
    if: needs.package.outputs.publish == 'true'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/pg-simple-auth/${{ needs.package.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
